version: '3.8'

# Development-only docker-compose config
# Usage: docker-compose -f docker-compose.dev.yml up

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: pluginout-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pluginout
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: pluginout-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data

  # Adminer - Database management UI (dev only)
  adminer:
    image: adminer
    container_name: pluginout-adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_dev_data:
  redis_dev_data:
